name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          scripts/install-bd.sh 1.3.1
      - name: Lint
        run: |
          shellcheck scripts/gh-to-beads.sh scripts/install-bd.sh tests/run.sh tests/server.sh tests/stubs/gh
          cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: End-to-end tests
        run: |
          tests/run.sh
          tests/server.sh
