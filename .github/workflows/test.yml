name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inotify-tools shellcheck
          scripts/install-bd.sh 1.3.1
      - name: Lint
        run: shellcheck bin/bd-gh-watch scripts/gh-to-beads.sh scripts/install-bd.sh tests/run.sh tests/stubs/gh
      - name: End-to-end tests
        run: tests/run.sh
