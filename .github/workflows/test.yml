name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          shellcheck scripts/install-bd.sh scripts/install-bd-gh-sync.sh
          cargo clippy --all-targets -- -D warnings
